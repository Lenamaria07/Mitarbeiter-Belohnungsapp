{% extends "base.html" %}

{% block title %}Mitarbeiter Login{% endblock %}

{% block content %}
<main class="max-w-md w-full mx-auto px-4 py-16 flex-grow flex flex-col justify-center">
    
    <div class="bg-white border border-slate-100 shadow-xl rounded-3xl p-6 sm:p-10">
        
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-xl mx-auto shadow-inner mb-3">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900">Dashboard Anmeldung</h2>
            <p class="text-xs text-slate-400 mt-1 font-medium">Loggen Sie sich ein, um Ihr persönliches Profil einzusehen.</p>
        </div>

        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-800 rounded-xl p-3.5 flex items-center gap-2.5 mb-6 shadow-sm">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-base"></i>
            <span class="text-xs font-bold">{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="post" class="flex flex-col gap-5">
            <div class="flex flex-col gap-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Benutzername</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required placeholder="Ihr Benutzername" class="block w-full rounded-xl border border-slate-200 bg-slate-50 pl-11 pr-4 py-3 text-slate-800 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 focus:outline-none text-sm transition font-medium">
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Passwort</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="block w-full rounded-xl border border-slate-200 bg-slate-50 pl-11 pr-4 py-3 text-slate-800 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 focus:outline-none text-sm transition font-medium">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 mt-2 text-sm">
                Anmelden <i class="fa-solid fa-right-to-bracket text-xs"></i>
            </button>
        </form>
    </div>
</main>
{% endblock %}
